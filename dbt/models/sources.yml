version: 2

sources:
  - name: lake
    description: Canonical Parquet files written by the ingestion layer (see src/complaint_radar/contracts/complaints.yml).
    tables:
      - name: complaints_archive
        description: CFPB complaints from the FOIA narratives archive (Dec 2011 to Aug 2026), one row per complaint.
        config:
          external_location: "read_parquet('{{ env_var('CR_LAKE_DIR', 'lake-not-configured') }}/complaints_archive/*.parquet')"

  - name: warehouse
    description: Append-only BigQuery tables written by the daily pipeline (load jobs only; sandbox has no DML).
    database: "{{ env_var('CR_BQ_PROJECT', 'complaint-radar-512308') }}"
    schema: complaint_radar
    tables:
      - name: raw_complaint_versions
        description: One row per new or changed complaint version (complaint_id, row_hash), partitioned by loaded_date.
      - name: pipeline_runs
        description: One row per daily pipeline run with status, step and row counts.
