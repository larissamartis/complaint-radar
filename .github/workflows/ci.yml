name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q -rf --tb=line 2>&1 | tee "$RUNNER_TEMP/pytest.txt"; exit "${PIPESTATUS[0]}"

      # Surface each failing test as an annotation, so failures are readable from the run summary.
      - name: Report failing tests
        if: failure()
        run: |
          { grep -E "^(FAILED|ERROR) |^E  |Error" "$RUNNER_TEMP/pytest.txt" | head -15; tail -n 8 "$RUNNER_TEMP/pytest.txt"; } \
            | while IFS= read -r line; do echo "::error title=pytest::${line}"; done

      - name: dbt build on fixture lake
        env:
          CR_LAKE_DIR: ${{ github.workspace }}/tests/fixtures/lake
          CR_DUCKDB_PATH: ${{ runner.temp }}/ci.duckdb
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t complaint-radar-api .

      - name: Smoke-test the running container
        run: |
          docker run -d --name api -p 8000:8000 complaint-radar-api
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health; then echo; break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8000/health | grep '"status":"ok"'
          if [ -f src/complaint_radar/data/triage_model.joblib ]; then
            curl -fs http://127.0.0.1:8000/health | grep '"model_loaded":true'
            curl -fs -X POST http://127.0.0.1:8000/score -H 'Content-Type: application/json' \
              -d '{"complaints":[{"date_received":"2026-10-20","product":"Credit card","issue":"Fees","company":"Bank B"}]}' \
              | grep relief_probability
          fi
          docker logs api | tail -20
