name: Daily pipeline

on:
  schedule:
    # CFPB's bulk file is refreshed around 09:15 UTC; run after it (17:00 IST).
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the CFPB API shows no new data"
        type: boolean
        default: false
      backfill_since:
        description: "Instead of a normal run, re-capture complaints received since YYYY-MM-DD"
        required: false

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CR_BQ_PROJECT: complaint-radar-512308
      PYTHONUTF8: "1"
      CR_LLM_TIMEOUT: "60"
    steps:
      # The runner context is only available inside steps, so runner-temp paths are exported here.
      - name: Set paths
        run: |
          echo "CR_DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Optional: a small local model for alert summaries. If this step fails the pipeline still runs and
      # uses template summaries (the CLI checks whether the model is available).
      - name: Start summary model (optional)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.8 sh
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          sleep 5
          ollama pull qwen2.5:1.5b

      - name: Write service-account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "::error::GCP_SA_KEY secret is not set"; exit 1; fi
          umask 077
          printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Run pipeline
        env:
          FORCE: ${{ inputs.force }}
          BACKFILL_SINCE: ${{ inputs.backfill_since }}
        run: |
          if [ -n "$BACKFILL_SINCE" ]; then
            uv run complaint-radar backfill --since "$BACKFILL_SINCE"
          else
            if [ "$FORCE" = "true" ]; then
              uv run complaint-radar run-daily --force
            else
              uv run complaint-radar run-daily
            fi
          fi

      - name: Remove key
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
