[project]
name = "complaint-radar"
version = "0.1.0"
description = "Early-warning and compliance-risk system for financial-services complaints"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Larissa Martis" }]
dependencies = [
    "duckdb>=1.5",
    "google-cloud-bigquery>=3.46.2",
    "pandas>=3.0.6",
    "pyarrow>=20",
    "pyyaml>=6",
    "requests>=2.32",
    "scipy>=1.18.1",
    "typer>=0.15",
]

[project.scripts]
complaint-radar = "complaint_radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
    "dbt-bigquery>=1.12.1",
]
text = [
    "bertopic>=0.17.4",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaint_radar"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/complaint_radar/cli.py" = ["B008"]  # typer declares options as defaults

[tool.uv]
# Text-modelling libraries are only needed locally (topic discovery); CI and the daily job skip them.
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
